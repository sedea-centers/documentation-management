name: New Documentation Folder Configuration
description: >-
  Configure a new gitignored documentation folder and rclone remote sync
  (GDrive first) — requires prior Required Tools / gcloud Drive client setup,
  then local path, registry, terminal remote setup that exits with dry-run, then
  full pull.
commands:
